name: Update Versions
on: create

permissions:
  contents: write

# Sets the manifest versions when a release branch is created.
# Branch names: release/X.Y.Z, or release/X.Y.Z-rcN for a pre-release. DNN Platform
# manifests can't hold a pre-release suffix, so both set the manifest to XX.YY.ZZ.
jobs:
  updateVersions:
    runs-on: ubuntu-latest
    if: ${{ github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get version from branch name
        id: branchVersion
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^release/([0-9]{1,2})\.([0-9]{1,2})\.([0-9]{1,2})(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Branch '$BRANCH' does not match release/X.Y.Z or release/X.Y.Z-rcN"
            exit 1
          fi
          printf -v version '%02d.%02d.%02d' "$((10#${BASH_REMATCH[1]}))" "$((10#${BASH_REMATCH[2]}))" "$((10#${BASH_REMATCH[3]}))"
          echo "manifestSafeVersionString=$version" >> "$GITHUB_OUTPUT"

      - name: set-dnn-manifest-versions
        uses: valadas/set-dnn-manifest-versions@36e719995c5c1511859b19462e4b4f9f64a0c412 # v1.3.0
        with:
          # Version to set in the manifests, should be a manifest save version string as in 09.06.00
          version: ${{ steps.branchVersion.outputs.manifestSafeVersionString }}
      - run: git add .
      - run: git config user.name "$ACTOR"
        env:
          ACTOR: ${{ github.actor }}
      - run: git config user.email "${{ github.actor }}@users.noreply.github.com"
      - run: git diff --quiet && git diff --staged --quiet || git commit -m 'Commit new manifest versions'
      - run: git push https://$ACTOR:$TOKEN@github.com/$REPOSITORY.git
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
